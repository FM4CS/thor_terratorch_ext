[project]
name = "thor-terratorch-ext"
version = "0.3.0"
description = "THOR extension for TerraTorch"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "terratorch==1.2.5",
    "thor @ git+https://github.com/FM4CS/THOR@fused_alibi",
]


[build-system]
requires = ["setuptools"]
build-backend = 'setuptools.build_meta'


[tool.setuptools.packages.find]
include = ["thor_terratorch_ext*"]

[dependency-groups]
dev = [
    "nbclient>=0.10.4",
    "nbconvert>=7.17.0",
    "nbformat>=5.10.4",
    "pytest>=9.0.2",
    "ruff>=0.14.8",
]
notebook = [
    "matplotlib>=3.7",
    "odc-stac>=0.5.2",
    "pystac-client>=0.9.0",
    "stac-asset>=0.4.7",
    "boto3>=1.42.61",
    "gdown>=5.2.1",
    "netcdf4>=1.7.4",
    "pyresample>=1.35.0",
    "phidown[jupyter-env,viz]>=0.1.26",
    "folium>=0.20.0",
    "ipykernel>=7.2.0",
    "ipython>=8.37.0",
    "ipywidgets>=8.1.8",
    "ipyleaflet>=0.20.0",
]
log = ["wandb>=0.19.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: tests that require network access (huggingface download)",
]
